<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AM Review Cards | كروت تقييم جوجل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#F4F2FA; --surface:#FFFFFF; --ink:#14121F; --muted:#575270; --line:#DDD8EC;
  --violet:#7C3AED; --violet-soft:#A78BFA; --gold:#F5B82E;
  --night:#0B0A12; --night-2:#161327; --night-ink:#F3F1FA; --night-muted:#A9A3C4;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E0C18;--surface:#17142A;--ink:#F3F1FA;--muted:#A9A3C4;--line:#2A2545;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E0C18;--surface:#17142A;--ink:#F3F1FA;--muted:#A9A3C4;--line:#2A2545;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.7;min-height:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.dark{background:var(--night);color:var(--night-ink)}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;direction:ltr}
.logo svg{width:38px;height:38px}
.logo small{display:block;font-weight:400;font-size:.7rem;letter-spacing:.14em;color:var(--night-muted);line-height:1}
.nav-r{display:flex;gap:10px;align-items:center}
.lang{background:none;border:1px solid #3a3459;color:var(--night-ink);border-radius:999px;padding:6px 16px;font:inherit;font-size:.9rem;cursor:pointer}
.btn{display:inline-block;background:linear-gradient(135deg,var(--violet),#5B21B6);color:#fff;font:inherit;font-weight:800;border:0;border-radius:12px;padding:14px 28px;cursor:pointer;text-decoration:none;font-size:1.05rem;box-shadow:0 8px 24px rgba(124,58,237,.4)}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:none;box-shadow:none;border:1px solid #3a3459;color:var(--night-ink)}
.btn.sm{padding:9px 18px;font-size:.95rem}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--violet-soft);outline-offset:3px}
.hero{padding:40px 0 70px;max-width:760px}
.eyebrow{display:inline-block;color:var(--violet-soft);font-weight:600;font-size:.9rem;border:1px solid #3a3459;border-radius:999px;padding:3px 14px;margin-bottom:18px}
h1{font-size:clamp(2.1rem,5.4vw,3.7rem);line-height:1.2;margin:0 0 18px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--violet-soft),#C4B5FD);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.15rem;color:var(--night-muted);margin:0 0 28px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.ticks{display:flex;gap:10px 22px;flex-wrap:wrap;list-style:none;padding:0;margin:0;color:var(--night-muted);font-weight:600}
.ticks li::before{content:"✓";color:var(--violet-soft);margin-inline-end:8px;font-weight:800}
section{padding:60px 0}
h2{font-size:1.9rem;margin:0 0 20px;font-weight:800}
.sub{color:var(--muted);max-width:42em;margin:0 0 26px;font-size:1.05rem}
.explain{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.explain p{margin:0 0 14px;font-size:1.08rem}
.problem{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:12px;padding:16px 20px;font-weight:600}
/* demo */
.demo{background:var(--night);color:var(--night-ink);border-radius:24px;padding:34px 22px;text-align:center}
.demo h2{margin-bottom:6px}
.demo .sub{color:var(--night-muted);margin:0 auto 18px}
.stage{position:relative;height:400px;max-width:460px;margin:0 auto;direction:ltr}
.glow{position:absolute;inset:40px 60px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.5),transparent 65%)}
.phone{position:absolute;right:30px;top:0;width:200px;height:390px;border-radius:32px;background:#0F0D1B;border:3px solid #2E2850;padding:12px;transition:transform .7s ease;box-shadow:0 26px 50px rgba(0,0,0,.5)}
.screen{position:relative;height:100%;border-radius:21px;background:#fff;color:#202124;overflow:hidden;font-size:.78rem;text-align:start}
.layer{position:absolute;inset:0;padding:18px 14px;transition:opacity .5s}
.home{background:linear-gradient(160deg,#2a2150,#0e0c18);color:#fff;display:grid;place-items:center;text-align:center;font-weight:600}
.review{opacity:0}
.review b{display:block;font-size:.95rem}
.stars{color:var(--gold);font-size:1.45rem;letter-spacing:4px;margin:10px 0;height:2rem}
.bar{height:8px;border-radius:4px;background:#E6E3F0;margin:8px 0}
.bar.s{width:60%}
.post{margin-top:16px;background:#7C3AED;color:#fff;border-radius:999px;text-align:center;padding:7px;font-weight:600}
.tcard{position:absolute;left:10px;bottom:40px;width:190px;height:120px;border-radius:14px;background:linear-gradient(135deg,#1C1838,#0B0A12);border:1px solid #3a3459;transform:rotate(-8deg);padding:12px;box-shadow:0 18px 36px rgba(0,0,0,.55)}
.tcard svg{width:30px;height:30px}
.tcard p{margin:6px 0 0;font-size:.72rem;color:var(--night-muted)}
.waves{position:absolute;right:12px;bottom:12px;width:40px;height:40px}
.waves i{position:absolute;inset:0;border:2px solid var(--violet-soft);border-radius:50%;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(45deg);opacity:.5}
.waves i:nth-child(2){inset:8px}.waves i:nth-child(3){inset:16px}
.demo.tap .phone{transform:translateX(-170px) rotate(-4deg)}
.demo.tap .waves i{opacity:1;animation:pulse 1s infinite}
.demo.open .home{opacity:0}
.demo.open .review{opacity:1}
.demo.open .waves i{animation:none;opacity:.5}
@keyframes pulse{50%{opacity:.2}}
.cap{min-height:3.2em;font-weight:600;margin:14px 0 14px;color:var(--night-ink)}
@media (prefers-reduced-motion:reduce){.phone,.layer{transition:none}.demo.tap .waves i{animation:none}html{scroll-behavior:auto}}
/* how to */
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
.panel h3{margin:0 0 14px;font-size:1.25rem}
.panel ol{margin:0;padding:0;list-style:none;counter-reset:s}
.panel li{counter-increment:s;display:flex;gap:12px;margin-bottom:14px;color:var(--ink)}
.panel li::before{content:counter(s);flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--violet);color:#fff;font-weight:800;font-size:.95rem}
.tip{margin-top:18px;background:var(--surface);border:1px dashed var(--violet);border-radius:12px;padding:14px 18px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;list-style:none;padding:0;margin:0}
.cards li{border-inline-start:4px solid var(--violet);background:var(--surface);border-radius:12px;padding:20px}
.cards b{display:block;font-size:1.1rem}
.cards span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0}
.chips li{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 20px;font-weight:600}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:800;font-size:1.05rem}
details p{margin:10px 0 0;color:var(--muted)}
/* order */
.order{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;padding:60px 0}
.order h2{margin:0 0 12px}
.get{list-style:none;padding:0;margin:0 0 16px}
.get li{margin-bottom:6px}
.get li::before{content:"✓";color:var(--violet-soft);margin-inline-end:10px;font-weight:800}
.price{font-size:1.5rem;font-weight:800;color:var(--violet-soft)}
.note{font-size:.92rem;color:var(--night-muted);margin:10px 0 0}
.fields{display:grid;gap:12px;background:var(--night-2);border:1px solid #2A2545;border-radius:18px;padding:24px}
input{font:inherit;padding:13px 14px;border-radius:10px;border:1px solid #3a3459;background:var(--night);color:var(--night-ink);width:100%}
input::placeholder{color:var(--night-muted)}
footer{padding:22px 0 90px;color:var(--night-muted);font-size:.9rem;border-top:1px solid #2A2545}
.float{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:999px;padding:12px 22px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@media (max-width:780px){
  .explain,.two,.order{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .stage{height:380px;transform:scale(.92)}
}
:root{--cyan:#22D3EE;--pink:#EC4899;--lime:#84CC16;--orange:#F97316}
body>.dark:first-child{background:radial-gradient(900px 420px at 85% -10%,rgba(124,58,237,.6),transparent 60%),radial-gradient(700px 380px at 5% 110%,rgba(34,211,238,.3),transparent 60%),var(--night)}
h1 em{background:linear-gradient(120deg,var(--cyan),var(--violet-soft) 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{border-color:var(--cyan);color:var(--cyan)}
.ticks li:nth-child(1)::before{color:var(--cyan)}.ticks li:nth-child(2)::before{color:var(--pink)}.ticks li:nth-child(3)::before{color:var(--lime)}
.btn{background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 8px 26px rgba(236,72,153,.35)}
.float{background:linear-gradient(135deg,#22C55E,#15803D);box-shadow:0 10px 30px rgba(21,128,61,.45)}
h2{position:relative;padding-bottom:14px}
h2::after{content:"";position:absolute;bottom:0;inset-inline-start:0;width:56px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.demo h2::after{inset-inline-start:calc(50% - 28px)}
.demo{background:radial-gradient(520px 320px at 15% 0,rgba(34,211,238,.28),transparent 60%),radial-gradient(520px 320px at 92% 100%,rgba(236,72,153,.28),transparent 60%),var(--night)}
.panel:nth-child(1){border-top:4px solid var(--cyan)}.panel:nth-child(2){border-top:4px solid var(--pink)}
.panel:nth-child(1) li::before{background:var(--cyan);color:#06222a}
.panel:nth-child(2) li::before{background:var(--pink)}
.cards li:nth-child(1){border-inline-start-color:var(--cyan)}.cards li:nth-child(2){border-inline-start-color:var(--pink)}.cards li:nth-child(3){border-inline-start-color:var(--orange)}
.chips li:nth-child(4n+1){background:rgba(34,211,238,.16);border-color:var(--cyan)}
.chips li:nth-child(4n+2){background:rgba(236,72,153,.16);border-color:var(--pink)}
.chips li:nth-child(4n+3){background:rgba(249,115,22,.16);border-color:var(--orange)}
.chips li:nth-child(4n+4){background:rgba(124,58,237,.16);border-color:var(--violet)}
.tip{border-color:var(--cyan)}
.tcard{background:linear-gradient(135deg,#FFFFFF,#D9DAE3);border:1px solid #BFC1D0;color:#23232f}
.tcard p{color:#4B4D60;font-weight:600;font-size:.78rem}
.tcard .waves i{border-color:#7C3AED;border-left-color:transparent;border-bottom-color:transparent}
.get li::before{color:var(--cyan)}
.price{color:var(--cyan)}
.fields{border-color:var(--violet)}
</style>
</head>
<body>

<div class="dark">
  <div class="wrap">
    <nav>
      <div class="logo">
        <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#5B21B6"/></linearGradient></defs><path d="M24 2 44 13v22L24 46 4 35V13z" fill="url(#g)"/><text x="24" y="30" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-weight="800" font-size="17" fill="#fff">AM</text></svg>
        <div>AM REVIEW<small>CARDS</small></div>
      </div>
      <div class="nav-r">
        <button class="lang" id="langBtn" type="button">English</button>
        <a class="btn sm waLink" href="#order" data-k="cta"></a>
      </div>
    </nav>
    <div class="hero">
      <span class="eyebrow" data-k="eyebrow"></span>
      <h1><span data-k="h1a"></span> <em data-k="h1b"></em></h1>
      <p class="lead" data-k="lead"></p>
      <div class="cta-row">
        <a class="btn" href="#order" data-k="cta"></a>
        <a class="btn ghost" href="#demo" data-k="see"></a>
      </div>
      <ul class="ticks"><li data-k="t1"></li><li data-k="t2"></li><li data-k="t3"></li></ul>
    </div>
  </div>
</div>

<main class="wrap">
  <section>
    <h2 data-k="whatT"></h2>
    <div class="explain">
      <div>
        <p data-k="what1"></p>
        <p data-k="what2"></p>
        <div class="problem" data-k="prob"></div>
      </div>
    </div>
  </section>

  <section id="demo" style="padding-top:0">
    <div class="demo" id="demoBox">
      <h2 data-k="demoT"></h2>
      <p class="sub" data-k="demoS"></p>
      <div class="stage" aria-hidden="true">
        <div class="glow"></div>
        <div class="phone"><div class="screen">
          <div class="layer home" id="homeTxt"></div>
          <div class="layer review">
            <b>Your Business</b>
            <div class="stars" id="stars"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar s"></div>
            <div class="post">Post</div>
          </div>
        </div></div>
        <div class="tcard">
          <svg viewBox="0 0 48 48"><g fill="none" stroke="#3b3b4f" stroke-width="3" stroke-linecap="round"><path d="M16 14a14 14 0 0 1 0 20"/><path d="M23 9a22 22 0 0 1 0 30"/><path d="M30 4a30 30 0 0 1 0 40"/></g></svg>
          <p>Tap to review</p>
          <div class="waves"><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="cap" id="cap" aria-live="polite"></div>
      <button class="btn" id="tryBtn" type="button"></button>
    </div>
  </section>

  <section style="padding-top:0">
    <h2 data-k="useT"></h2>
    <div class="two">
      <div class="panel">
        <h3 data-k="ownT"></h3>
        <ol><li data-k="o1"></li><li data-k="o2"></li><li data-k="o3"></li></ol>
      </div>
      <div class="panel">
        <h3 data-k="cusT"></h3>
        <ol><li data-k="u1"></li><li data-k="u2"></li><li data-k="u3"></li></ol>
      </div>
    </div>
    <div class="tip" data-k="tip"></div>
  </section>

  <section style="padding-top:0">
    <h2 data-k="whyT"></h2>
    <ul class="cards">
      <li><b data-k="w1t"></b><span data-k="w1d"></span></li>
      <li><b data-k="w2t"></b><span data-k="w2d"></span></li>
      <li><b data-k="w3t"></b><span data-k="w3d"></span></li>
    </ul>
  </section>

  <section style="padding-top:0">
    <h2 data-k="forT"></h2>
    <ul class="chips">
      <li data-k="c1"></li><li data-k="c2"></li><li data-k="c3"></li><li data-k="c4"></li><li data-k="c5"></li><li data-k="c6"></li><li data-k="c7"></li>
    </ul>
  </section>

  <section style="padding-top:0">
    <h2 data-k="faqT"></h2>
    <details><summary data-k="q1"></summary><p data-k="a1"></p></details>
    <details><summary data-k="q2"></summary><p data-k="a2"></p></details>
    <details><summary data-k="q3"></summary><p data-k="a3"></p></details>
    <details><summary data-k="q4"></summary><p data-k="a4"></p></details>
    <details><summary data-k="q6"></summary><p data-k="a6"></p></details>
    <details><summary data-k="q7"></summary><p data-k="a7"></p></details>
    <details><summary data-k="q5"></summary><p data-k="a5"></p></details>
  </section>
</main>

<div class="dark" id="order">
  <div class="wrap">
    <div class="order">
      <div>
        <h2 data-k="ordT"></h2>
        <ul class="get"><li data-k="g1"></li><li data-k="g2"></li><li data-k="g3"></li></ul>
        <div class="price" id="price"></div>
        <p class="note" data-k="trust"></p>
      </div>
      <div class="fields">
        <input id="fName" type="text" autocomplete="name" data-ph="phName">
        <input id="fQty" type="number" min="1" inputmode="numeric" data-ph="phQty">
        <button class="btn" id="sendBtn" type="button" data-k="send"></button>
      </div>
    </div>
    <footer data-k="foot"></footer>
  </div>
</div>

<a class="btn float waLink" id="floatBtn" href="#order" data-k="floatTxt"></a>

<script>
// Edit these two values before sharing the page
var CONFIG = {
  whatsapp: "201067176220",  // 20 + number without the first 0
  price: ""                  // for example "250"; leave empty to show "ask for today’s price"
};

var T = {
  ar:{
    eyebrow:"كروت تقييم جوجل NFC و QR",
    h1a:"خلّي عملاءك يقيّموك على جوجل", h1b:"بلمسة واحدة",

    what2:"أول ما العميل يقرّب موبايله من الكارت، صفحة التقييم تفتح له على طول. بدل ما يدوّر على اسم مكانك ويدخل ويكتب، بيختار النجوم ويكتب رأيه وخلاص.",

    w1t:"تقييمات أكتر", w1d:"لما الطريق يبقى سهل، ناس أكتر بتقيّم فعلاً.",
    w2t:"ثقة وظهور", w2d:"تقييمات أكتر بتساعد الناس الجديدة تثق فيك وتلاقيك على خرائط جوجل.",
    w3t:"سهل على موظفينك", w3d:"مفيش شرح طويل. الكارت قدام العميل وهو يعمل الباقي.",

    c1:"كافيهات", c2:"مطاعم", c3:"جيمات", c4:"صالونات وحلاقين", c5:"عيادات", c6:"خدمات سيارات", c7:"أماكن ألعاب",

var cur = "ar", state = 0, timers = [];
var box = document.getElementById("demoBox");
function wa(text){ return "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(text); }
function clearT(){ timers.forEach(clearTimeout); timers = []; }
function paintDemo(){
  var t = T[cur];
  document.getElementById("homeTxt").textContent = t.home;
  document.getElementById("cap").textContent = t["cap" + state];
  document.getElementById("tryBtn").textContent = state === 2 ? t.try1 : t.try0;
}
function runDemo(){
  clearT();
  if (state === 2) { state = 0; box.className = "demo"; document.getElementById("stars").textContent = ""; paintDemo(); return; }
  state = 1; box.className = "demo tap"; paintDemo();
  timers.push(setTimeout(function(){
    state = 2; box.className = "demo tap open"; paintDemo();
    var s = "", i = 0;
    (function fill(){ if (i < 5) { s += "★"; document.getElementById("stars").textContent = s; i++; timers.push(setTimeout(fill, 160)); } })();
  }, 900));
}
function render(){
  var t = T[cur];
  document.documentElement.lang = cur;
  document.documentElement.dir = t.dir;
  document.querySelectorAll("[data-k]").forEach(function(el){ el.textContent = t[el.dataset.k]; });
  document.querySelectorAll("[data-ph]").forEach(function(el){ el.placeholder = t[el.dataset.ph]; });
  document.getElementById("price").textContent = CONFIG.price ? t.priceSet(CONFIG.price) : t.priceAsk;
  document.getElementById("langBtn").textContent = t.lang;
  document.querySelectorAll(".waLink").forEach(function(a){ a.href = wa(t.gen); a.target = "_blank"; a.rel = "noopener"; });
  document.querySelectorAll('a.btn[href="#order"]').forEach(function(a){ a.href = wa(t.gen); a.target = "_blank"; a.rel = "noopener"; });
  paintDemo();
}
document.getElementById("langBtn").addEventListener("click", function(){ cur = cur === "ar" ? "en" : "ar"; render(); });
document.getElementById("tryBtn").addEventListener("click", runDemo);
document.getElementById("sendBtn").addEventListener("click", function(){
  var n = document.getElementById("fName").value.trim() || "—";
  var b = document.getElementById("fQty").value.trim() || "1";
  window.open(wa(T[cur].msg(n, b)), "_blank", "noopener");
});
render();
</script>
